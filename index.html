<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#20358f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="e-Absen SLB AN">
  <link rel="manifest" href="./manifest.json">
  <title>e-Absen SLB AN</title>
  <style>
    :root{--primary:#20358f;--bg:#eef3f8;--text:#12203a;--muted:#64748b;--border:#dbe3ef}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    body{overflow:hidden}
    .setup{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(115deg,#193d79,#1d5b72 45%,#0e705c);z-index:10}
    .card{width:min(640px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 24px 80px rgba(15,23,42,.25)}
    .logo{display:block;width:96px;height:96px;margin:0 auto 14px;object-fit:contain}
    h1{margin:0;text-align:center;color:var(--primary);font-size:28px}
    p{color:var(--muted);line-height:1.55}
    label{display:block;font-weight:800;margin:18px 0 8px}
    input{width:100%;height:52px;padding:0 14px;border:1px solid var(--border);border-radius:12px;font-size:15px}
    input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(32,53,143,.1)}
    button{width:100%;height:52px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:14px}
    button.secondary{background:#fff;color:var(--primary);border:1px solid #cbd5e1}
    .msg{margin-top:12px;padding:11px 13px;border-radius:10px;background:#fff5f5;border:1px solid #fecaca;color:#b91c1c;font-size:13px;font-weight:700;display:none}
    .msg.show{display:block}
    .hint{font-size:12px}
    .app{position:fixed;inset:0;display:none;background:#fff}
    .app iframe{width:100%;height:100%;border:0;display:block}
    .top{position:fixed;right:10px;top:10px;z-index:5;display:flex;gap:8px}
    .top button{width:auto;height:38px;margin:0;padding:0 12px;font-size:12px;background:rgba(255,255,255,.96);color:var(--primary);border:1px solid #cbd5e1;box-shadow:0 4px 14px rgba(15,23,42,.12)}
    .top button.danger{color:#b91c1c;border-color:#fecaca}
    @media (max-width:620px){
      .card{padding:22px 18px}
      h1{font-size:24px}
      .logo{width:84px;height:84px}
    }
  </style>
</head>
<body>
  <section id="setup" class="setup">
    <div class="card">
      <img class="logo" src="./icon-192.svg" alt="Logo SLB">
      <h1>e-Absen SLB AN</h1>
      <p style="text-align:center;margin:8px 0 18px">Hubungkan PWA ini ke Web App Google Apps Script yang sudah berfungsi.</p>

      <label for="backendUrl">URL Web App Apps Script</label>
      <input id="backendUrl" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/...../exec">

      <button id="connectBtn">BUKA APLIKASI</button>
      <button id="clearBtn" class="secondary">HAPUS URL TERSIMPAN</button>

      <div id="msg" class="msg"></div>

      <p class="hint">
        URL yang diminta adalah URL Web App e-Absen Anda yang sekarang sudah bisa
        login dan melakukan absensi. URL akan disimpan hanya di perangkat ini.
      </p>
    </div>
  </section>

  <main id="app" class="app">
    <div class="top">
      <button id="changeBtn">GANTI SERVER</button>
      <button id="reloadBtn">MUAT ULANG</button>
    </div>
    <iframe id="appFrame"
      title="e-Absen SLB AN"
      allow="camera; microphone; geolocation"
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>

  <script>
    const KEY="EABSEN_PWA_BACKEND_URL_V1";
    const $=id=>document.getElementById(id);

    function cleanUrl(v){
      let s=String(v||"").trim();
      if(!s)return "";
      if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:[?#].*)?$/i.test(s)){
        throw new Error("URL Web App Apps Script tidak valid.");
      }
      return s;
    }

    function showMsg(text){
      $("msg").textContent=text||"";
      $("msg").classList.toggle("show",!!text);
    }

    function openBackend(url){
      try{
        const clean=cleanUrl(url);
        localStorage.setItem(KEY,clean);
        $("backendUrl").value=clean;
        $("setup").style.display="none";
        $("app").style.display="block";
        $("appFrame").src=clean;
      }catch(e){
        showMsg(e.message||"URL server tidak valid.");
      }
    }

    function showSetup(){
      $("appFrame").src="about:blank";
      $("app").style.display="none";
      $("setup").style.display="grid";
      $("backendUrl").focus();
    }

    $("connectBtn").addEventListener("click",()=>openBackend($("backendUrl").value));

    $("backendUrl").addEventListener("keydown",e=>{
      if(e.key==="Enter")openBackend($("backendUrl").value);
    });

    $("clearBtn").addEventListener("click",()=>{
      localStorage.removeItem(KEY);
      $("backendUrl").value="";
      showMsg("URL server yang tersimpan sudah dihapus.");
    });

    $("changeBtn").addEventListener("click",showSetup);

    $("reloadBtn").addEventListener("click",()=>{
      const f=$("appFrame");
      try{
        f.contentWindow.location.reload();
      }catch(_){
        const u=localStorage.getItem(KEY);
        if(u) f.src=u;
      }
    });

    // Query parameter ?backend=... can preconfigure the app without editing code.
    try{
      const q=new URLSearchParams(location.search).get("backend");
      if(q) localStorage.setItem(KEY,cleanUrl(q));
    }catch(_){}

    const saved=localStorage.getItem(KEY);
    if(saved){
      try{openBackend(saved);}catch(_){showSetup();}
    }

    // Register PWA service worker.
    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("./service-worker.js").catch(err=>{
        console.warn("Service worker tidak aktif:",err);
      });
    }
  </script>
</body>
</html>
