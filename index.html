<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#20358f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="e-Absen SLB AN">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.svg" type="image/svg+xml">
  <title>e-Absen SLB AN</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#eef3f8}
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    #appFrame{display:block;width:100%;height:100dvh;height:100svh;height:100vh;border:0;margin:0;padding:0;background:#eef3f8}
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#eef3f8;z-index:2;transition:opacity .2s ease}
    .boot-card{width:min(320px,calc(100% - 32px));padding:24px 20px;border-radius:20px;background:#fff;box-shadow:0 18px 50px rgba(15,23,42,.12);text-align:center}
    .boot-card img{width:72px;height:72px;object-fit:contain;margin-bottom:10px}
    .boot-title{font-weight:800;color:#20358f;font-size:20px}
    .boot-sub{margin-top:4px;color:#64748b;font-size:12px}
    .spinner{width:28px;height:28px;border:3px solid #dbe3ef;border-top-color:#20358f;border-radius:50%;margin:16px auto 0;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="boot" aria-live="polite">
    <div class="boot-card">
      <img src="./icon-192.svg" alt="Logo SLB AN">
      <div class="boot-title">e-Absen SLB AN</div>
      <div class="boot-sub">Membuka aplikasi...</div>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbymde3T1CXRu4zAwrDc95CN68THH1soVCLmMY7qoRrDQOGT8LhRaN7i8-rVL0DfgqGr/exec"
    title="e-Absen SLB AN"
    allow="camera; microphone; geolocation; fullscreen"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <script>
    (function(){
      var frame=document.getElementById("appFrame");
      var boot=document.getElementById("boot");

      frame.addEventListener("load",function(){
        boot.style.opacity="0";
        setTimeout(function(){boot.style.display="none"},220);
      });

      if("serviceWorker" in navigator){
        navigator.serviceWorker.register("./service-worker.js").catch(function(err){
          console.warn("Service worker tidak aktif:",err);
        });
      }
    })();
  </script>
</body>
</html>
